# ── Application under test ──────────────────────────────────────────────────
# Either point at an installable app (path relative to the project root, or absolute)
# or leave it blank and give a package/activity (Android) or bundle id (iOS) of an
# app that is already on the device. The sample suite uses the built-in Android
# Settings app so the kit runs with no APK.
AndroidApp=
AndroidAppPackage=com.android.settings
AndroidAppActivity=com.android.settings.Settings
AndroidAutomationName=UiAutomator2

iOSApp=
iOSBundleId=com.apple.Preferences
iOSAutomationName=XCUITest

# Keep app data between sessions (true) or reinstall/reset each session (false)
NoReset=true
